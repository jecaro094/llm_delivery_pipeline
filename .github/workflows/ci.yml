name: CI

on:
  push:
    branches: [main, layer_2]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  # The whole package is covered at 100%; any regression fails the build.
  COVERAGE_THRESHOLD: "100"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # producer extras (huggingface-hub) are enough: mypy resolves
      # transformers/torch through ignore_missing_imports overrides,
      # so the heavy consumer extras are never needed to type-check.
      - run: pip install --upgrade pip && pip install .[producer,dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # The test suite mocks transformers/torch (see tests/test_consumer.py)
      # precisely so the environment never needs the heavy consumer extras.
      - run: pip install --upgrade pip && pip install .[producer,dev]
      # `python -m pytest`, not the `pytest` console script: tests/ has no
      # __init__.py, so `import tests.constants` only resolves when the repo
      # root is on sys.path, which `python -m` guarantees and a bare
      # `pytest` invocation does not.
      - run: python -m pytest --cov=model_pipeline --cov-report=term-missing
      - run: coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --upgrade pip && pip install .[producer,consumer,dev] pip-audit
      - run: pip-audit
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.producer
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.consumer
          config: .hadolint.yaml

  k8s-manifests:
    name: K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kind, not minikube: it runs Kubernetes nodes as plain Docker
      # containers, so it needs no KVM/nested virtualization and starts in
      # seconds on any GitHub-hosted runner.
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      # The namespace and the ServiceAccount are created for real first: a
      # server-side dry-run does not persist them, so validating the
      # dependent resources below in the same dry-run would otherwise fail
      # with spurious "namespace not found" / "serviceaccount not found"
      # errors (the latter is enforced by the ServiceAccount admission
      # controller when the consumer Pod is validated).
      - run: kubectl apply -f k8s/namespace.yaml
      - run: kubectl apply -f k8s/serviceaccount.yaml
      # Server-side dry-run: the remaining manifests are sent to a real API
      # server (schema, enum values, immutability rules) without persisting
      # any object, so this needs neither the Secrets nor the container
      # images the real workloads depend on. It only catches structural
      # mistakes in the manifests, not whether the pipeline behaves
      # correctly at runtime — that is what the local minikube demo in
      # README.md is for.
      - run: kubectl apply -k k8s/ --dry-run=server

  build:
    name: Build images
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.producer
          push: false
          tags: model-pipeline-producer:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.consumer
          push: false
          tags: model-pipeline-consumer:ci
