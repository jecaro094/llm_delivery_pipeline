  # both Dockerfiles already fix its UID/GID to 1000 via `useradd --uid/--gid`,
  # which is what actually matters for Kubernetes securityContext checks.
  - DL3066
  # SC2102 is a false positive here: it misreads the `.[producer]`/`.[consumer]`
  # pip extras syntax as a shell character-range glob.
  - SC2102
