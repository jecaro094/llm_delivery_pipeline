# Template only, not applied by kustomization.yaml and never filled in with
# real values: every Secret here is created imperatively (see
# scripts/gen-key.sh, scripts/gen-signing-key.sh, and README.md) so that no
# key material or token ever lands in a file tracked by git.
apiVersion: v1
kind: Secret
metadata:
  name: model-encryption-key
  namespace: confidential-models
type: Opaque
stringData:
  encryption-key: "<base64-encoded 32-byte AES key, e.g. output of `python -m model_pipeline keygen`>"
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-credentials
  namespace: confidential-models
type: Opaque
stringData:
  # The producer Job reads this as HF_TOKEN (see k8s/producer-job.yaml). A
  # mounted-file form is also supported, symmetric with the encryption key:
  # rename this key to e.g. hf-token-file, mount the Secret as a volume, and
  # point HF_TOKEN_FILE at the mounted path instead of using this env var.
  hf-token: "<Hugging Face token with write access, needed by the producer only>"
---
apiVersion: v1
kind: Secret
metadata:
  name: model-signing-key
  namespace: confidential-models
type: Opaque
stringData:
  signing-key.pem: |
    <PEM-encoded Ed25519 private key (PKCS#8), e.g. the first block printed
    by `python -m model_pipeline signing-keygen`. Mounted only by the
    producer; the consumer never has a mount path for this Secret.>
